<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huemory: remember the colour</title>
<meta name="description" content="Huemory. See a colour for 3 seconds, then recreate it from memory. Five colours a day.">
<meta property="og:title" content="Huemory: remember the colour">
<meta property="og:description" content="See a colour for 3 seconds, then recreate it from memory. Five colours a day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182430; --bg:#FFFFFF; --panel:#F6F6F4; --line:#DCDCD6;
    --accent:#C98A2E; --muted:#5C6975; --on-accent:#182430;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="dark"]{
    --ink:#EDE6D6; --bg:#16232E; --panel:#1D2E3D; --line:#2C4155;
    --accent:#D7A24A; --muted:#AEC0CD; --on-accent:#F4F7F9;
  }
  *{box-sizing:border-box;}
  html,body{min-height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    display:flex; flex-direction:column; align-items:center;
    padding:20px 14px 28px;
    transition:background .25s ease, color .25s ease;
  }
  #themeToggle{
    position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); right:14px; z-index:5;
    background:var(--panel); border:1.5px solid #B8BEC4; border-radius:20px;
    box-shadow:0 2px 6px rgba(0,0,0,0.12);
    width:42px; height:42px; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  :root[data-theme="dark"] #themeToggle{ border-color:var(--line); box-shadow:0 2px 6px rgba(0,0,0,0.3); }

  header{text-align:center; margin-bottom:6px;}
  h1{
    font-family:'Fraunces',serif; font-weight:700; font-size:clamp(26px,6vw,40px);
    margin:0; letter-spacing:0.5px;
  }
  h1 .icon{ font-size:0.85em; margin-right:6px; }
  h1 .hl{color:var(--accent);}
  .sub{color:var(--muted); font-size:13px; margin-top:4px;}
  .meta{color:var(--muted); font-size:12px; margin-top:2px;}

  #modeToggle{ display:flex; justify-content:center; gap:8px; margin-top:14px; }
  .modeBtn{
    font-family:inherit; font-size:12px; font-weight:600; letter-spacing:.3px;
    background:var(--panel); color:var(--muted); border:1px solid var(--line); border-radius:20px;
    padding:8px 18px; cursor:pointer;
  }
  .modeBtn.active{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }

  main{ width:100%; max-width:460px; display:flex; flex-direction:column; align-items:center; }

  #prompt{ margin-top:22px; text-align:center; }
  #prompt .small{ font-size:12px; color:var(--muted); letter-spacing:.5px; text-transform:uppercase; }
  #prompt .country{
    font-family:'Fraunces',serif; font-weight:700; font-size:clamp(24px,7vw,34px);
    margin-top:2px;
  }



  main{ max-width:460px; }
  #prog{ margin-top:18px; font-size:12px; color:var(--muted); text-align:center; }
  #stage{ width:100%; margin-top:10px; text-align:center; }
  #show{ height:220px; border-radius:14px; border:2px solid var(--line); }
  #timer{ height:6px; border-radius:4px; background:var(--panel); margin-top:12px; overflow:hidden; }
  #timer i{ display:block; height:100%; width:100%; background:var(--accent); transform-origin:left; }
  #timer i.run{ animation:shrink 3s linear forwards; }
  @keyframes shrink{ from{ transform:scaleX(1);} to{ transform:scaleX(0);} }
  .cap{ margin-top:10px; font-size:13px; color:var(--muted); }
  #mine{ height:64px; border-radius:12px; border:2px solid var(--line); }
  #sv{ display:block; width:100%; aspect-ratio:8/5; margin-top:12px; border-radius:12px; border:2px solid var(--line); touch-action:none; cursor:crosshair; }
  #hue{ -webkit-appearance:none; appearance:none; width:100%; height:22px; margin-top:12px; border-radius:11px; border:2px solid var(--line);
    background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); outline:none; }
  #hue::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:#fff; border:3px solid #222; cursor:pointer; }
  #hue::-moz-range-thumb{ width:22px; height:22px; border-radius:50%; background:#fff; border:3px solid #222; cursor:pointer; }
  .act{ font-family:inherit; font-size:14px; font-weight:700; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:12px 24px; cursor:pointer; }
  .act.primary{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .actrow{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .pair{ display:flex; gap:10px; }
  .pair div{ flex:1; }
  .pair .sw{ height:150px; border-radius:12px; border:2px solid var(--line); }
  .pair .t{ margin-top:6px; font-size:12px; color:var(--muted); }
  .pts{ margin-top:14px; font-family:'Fraunces',serif; font-weight:700; font-size:40px; line-height:1; font-optical-sizing:none; font-variation-settings:"opsz" 14; }
  .pts small{ font-size:15px; color:var(--muted); font-weight:500; font-family:'IBM Plex Mono',monospace; }
  #final{ width:100%; margin-top:22px; text-align:center; }
  #final .total{ font-family:'Fraunces',serif; font-weight:700; font-size:46px; line-height:1; margin-top:6px; font-optical-sizing:none; font-variation-settings:"opsz" 14; }
  #final .total small{ font-size:16px; color:var(--muted); font-weight:500; font-family:'IBM Plex Mono',monospace; }
  #final .verdict{ margin-top:8px; font-size:15px; font-weight:700; }
  .strip{ display:flex; gap:8px; margin-top:16px; }
  .strip .col{ flex:1; }
  .strip .a,.strip .b{ height:54px; border:1px solid var(--line); }
  .strip .a{ border-radius:8px 8px 0 0; } .strip .b{ border-radius:0 0 8px 8px; border-top:0; }
  .strip .s{ margin-top:5px; font-size:12px; font-weight:700; }
  .hint{ margin-top:8px; font-size:11px; color:var(--muted); }
  .hidden{display:none !important;}
  h1{ font-optical-sizing:none; font-variation-settings:"opsz" 14; }
</style>
</head>
<body>
<button id="themeToggle" title="Toggle night mode">🌙</button>
<header>
  <h1><span class="icon">🎨</span>Hue<span class="hl">mory</span></h1>
  <div class="sub">Remember the colour</div>
  <div class="meta" id="dateLabel"></div>
</header>
<main>
  <div id="prog"></div>
  <div id="stage">
    <div id="view"></div>
  </div>
  <div id="final" class="hidden"></div>
</main>
<script>
(function(){
  var ROUNDS=5, SHOW_MS=3000;
  var root=document.documentElement;
  function applyTheme(t){ root.setAttribute("data-theme",t); document.getElementById("themeToggle").textContent = t==="dark"?"☀️":"🌙"; }
  var th="light"; try{ th=localStorage.getItem("huemoryTheme")||"light"; }catch(e){}
  applyTheme(th);
  document.getElementById("themeToggle").onclick=function(){ var t=root.getAttribute("data-theme")==="dark"?"light":"dark"; applyTheme(t); try{ localStorage.setItem("huemoryTheme",t); }catch(e){} };
  function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  var el=function(i){ return document.getElementById(i); };

  // colour maths
  function hsb2rgb(h,s,v){ var c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c, r,g,b;
    if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;} else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
    return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]; }
  function css(c){ return "rgb("+c[0]+","+c[1]+","+c[2]+")"; }
  function lab(c){ function f(u){ u/=255; return u<=0.04045?u/12.92:Math.pow((u+0.055)/1.055,2.4); }
    var r=f(c[0]),g=f(c[1]),b=f(c[2]);
    var X=(0.4124*r+0.3576*g+0.1805*b)/0.95047, Y=0.2126*r+0.7152*g+0.0722*b, Z=(0.0193*r+0.1192*g+0.9505*b)/1.08883;
    function t(v){ return v>0.008856?Math.cbrt(v):7.787*v+16/116; }
    return [116*t(Y)-16, 500*(t(X)-t(Y)), 200*(t(Y)-t(Z))]; }
  function deltaE(a,b){ var p=lab(a), q=lab(b); return Math.sqrt(Math.pow(p[0]-q[0],2)+Math.pow(p[1]-q[1],2)+Math.pow(p[2]-q[2],2)); }
  function scoreOf(a,b){ return Math.round(100*Math.exp(-deltaE(a,b)/30)); }
  function emo(s){ return s>=85?"🟩":s>=60?"🟨":s>=35?"🟧":"🟥"; }

  var day=Math.floor(Date.now()/86400000), storeKey="huemory_"+todayStr();
  var rng=mulberry(day*7919+1), targets=[];
  for(var i=0;i<ROUNDS;i++){ var h=Math.floor(rng()*360), s=0.3+rng()*0.65, v=0.35+rng()*0.6; targets.push(hsb2rgb(h,s,v)); }
  var guesses=[];   // each: [r,g,b]
  try{ var sv0=JSON.parse(localStorage.getItem(storeKey)); if(sv0&&sv0.g) guesses=sv0.g.slice(0,ROUNDS); }catch(e){}
  function save(){ try{ localStorage.setItem(storeKey,JSON.stringify({g:guesses})); }catch(e){} }
  el("dateLabel").textContent=todayStr();

  var view=el("view"), cur={h:0,s:0.5,v:0.5}, timerId=null;

  function round(){ return guesses.length; }
  function stepShow(){
    var n=round(); el("prog").textContent="Colour "+(n+1)+" of "+ROUNDS;
    view.innerHTML="<div id='show'></div><div id='timer'><i></i></div><div class='cap'>Remember this colour</div><div class='actrow'><button class='act primary' id='goBtn'>Show me</button></div>";
    el("show").style.background="var(--panel)"; el("show").innerHTML="<div style='height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px'>Ready? You get 3 seconds.</div>";
    el("timer").style.visibility="hidden"; el("show").parentNode.querySelector(".cap").textContent="";
    el("goBtn").onclick=function(){ this.blur(); showColour(); };
  }
  function showColour(){
    var n=round(); var t=targets[n];
    view.innerHTML="<div id='show'></div><div id='timer'><i class='run'></i></div><div class='cap'>Remember this colour</div>";
    el("show").style.background=css(t);
    clearTimeout(timerId); timerId=setTimeout(pick,SHOW_MS);
  }
  var drawing=false;
  function pick(){
    cur={h:0,s:0.5,v:0.5};
    view.innerHTML="<div id='mine'></div><canvas id='sv' width='640' height='400'></canvas><input type='range' id='hue' min='0' max='360' value='0' aria-label='Hue'><div class='actrow'><button class='act primary' id='lockBtn'>Lock in</button></div>";
    var cv=el("sv"), ctx=cv.getContext("2d");
    function paint(){
      var W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
      ctx.fillStyle=css(hsb2rgb(cur.h,1,1)); ctx.fillRect(0,0,W,H);
      var g1=ctx.createLinearGradient(0,0,W,0); g1.addColorStop(0,"#fff"); g1.addColorStop(1,"rgba(255,255,255,0)"); ctx.fillStyle=g1; ctx.fillRect(0,0,W,H);
      var g2=ctx.createLinearGradient(0,0,0,H); g2.addColorStop(0,"rgba(0,0,0,0)"); g2.addColorStop(1,"#000"); ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
      var x=cur.s*W, y=(1-cur.v)*H; ctx.lineWidth=5; ctx.strokeStyle="#fff"; ctx.beginPath(); ctx.arc(x,y,16,0,6.2832); ctx.stroke();
      ctx.lineWidth=2; ctx.strokeStyle="#000"; ctx.beginPath(); ctx.arc(x,y,19,0,6.2832); ctx.stroke();
      el("mine").style.background=css(hsb2rgb(cur.h,cur.s,cur.v));
    }
    function setFrom(e){ var r=cv.getBoundingClientRect(); cur.s=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); cur.v=1-Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)); paint(); }
    cv.addEventListener("pointerdown",function(e){ drawing=true; cv.setPointerCapture(e.pointerId); setFrom(e); });
    cv.addEventListener("pointermove",function(e){ if(drawing) setFrom(e); });
    cv.addEventListener("pointerup",function(){ drawing=false; });
    el("hue").addEventListener("input",function(){ cur.h=Number(this.value); paint(); });
    el("lockBtn").onclick=function(){ this.blur(); lock(); };
    paint();
  }
  function lock(){
    var g=hsb2rgb(cur.h,cur.s,cur.v); guesses.push(g); save();
    var n=guesses.length-1, t=targets[n], sc=scoreOf(g,t);
    el("prog").textContent="Colour "+(n+1)+" of "+ROUNDS;
    view.innerHTML="<div class='pair'><div><div class='sw' style='background:"+css(t)+"'></div><div class='t'>The colour</div></div><div><div class='sw' style='background:"+css(g)+"'></div><div class='t'>Yours</div></div></div>"+
      "<div class='pts'>"+sc+"<small> / 100</small></div><div class='actrow'><button class='act primary' id='nextBtn'>"+(n+1>=ROUNDS?"See total":"Next colour")+"</button></div>";
    el("nextBtn").onclick=function(){ this.blur(); next(); };
  }
  function next(){ if(guesses.length>=ROUNDS) finish(); else stepShow(); }
  function finish(){
    el("stage").classList.add("hidden"); el("prog").textContent=""; var f=el("final"); f.classList.remove("hidden");
    var scores=guesses.map(function(g,i){ return scoreOf(g,targets[i]); }), tot=scores.reduce(function(a,b){ return a+b; },0);
    var verdict = tot>=440?"A painter's memory.":tot>=360?"Sharp eye.":tot>=280?"Pretty good.":tot>=180?"Fuzzy, but in the area.":"Colours are slippery.";
    var cols=""; for(var i=0;i<ROUNDS;i++) cols+="<div class='col'><div class='a' style='background:"+css(targets[i])+"'></div><div class='b' style='background:"+css(guesses[i])+"'></div><div class='s'>"+scores[i]+"</div></div>";
    f.innerHTML="<div class='total'>"+tot+"<small> / 500</small></div><div class='verdict'>"+verdict+"</div><div class='strip'>"+cols+"</div><div class='hint'>Top: the colour. Bottom: yours.</div>"+
      "<div class='actrow'><button class='act primary' id='copyBtn'>Copy result</button><button class='act' id='imgBtn'>Save image</button></div>";
    var share="Huemory "+todayStr()+"\n🎨 "+tot+"/500\n"+scores.map(emo).join("");
    el("copyBtn").onclick=function(){ var b=this; function ok(){ b.textContent="Copied"; setTimeout(function(){ b.textContent="Copy result"; },1500); }
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(share).then(ok,function(){ prompt("Copy:",share); }); } else prompt("Copy:",share); };
    el("imgBtn").onclick=function(){ saveImage(scores,tot); };
  }
  function saveImage(scores,tot){
    var W=700,H=470,c=document.createElement("canvas"); c.width=W; c.height=H; var x=c.getContext("2d");
    var dark=root.getAttribute("data-theme")==="dark"; x.fillStyle=dark?"#16232E":"#FFFFFF"; x.fillRect(0,0,W,H);
    var ink=dark?"#EDE6D6":"#182430", mut=dark?"#AEC0CD":"#5C6975";
    x.fillStyle=ink; x.font="bold 34px Georgia, serif"; x.textAlign="center"; x.fillText("Huemory",W/2,56);
    x.fillStyle=mut; x.font="16px monospace"; x.fillText(todayStr(),W/2,82);
    x.fillStyle=ink; x.font="bold 56px Georgia, serif"; x.fillText(tot+" / 500",W/2,152);
    var cw=112,gap=16,left=(W-(ROUNDS*cw+(ROUNDS-1)*gap))/2;
    for(var i=0;i<ROUNDS;i++){ var px=left+i*(cw+gap);
      x.fillStyle=css(targets[i]); x.fillRect(px,185,cw,110); x.fillStyle=css(guesses[i]); x.fillRect(px,295,cw,110);
      x.fillStyle=ink; x.font="bold 20px monospace"; x.fillText(String(scores[i]),px+cw/2,432); }
    x.fillStyle=mut; x.font="13px monospace"; x.fillText("top: the colour   bottom: mine",W/2,456);
    c.toBlob(function(b){ var a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="huemory-"+todayStr()+".png"; document.body.appendChild(a); a.click(); a.remove(); },"image/png");
  }

  if(guesses.length>=ROUNDS) finish(); else stepShow();
})();
</script>
</body>
</html>
